services:
  enterprise-ui:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/enterprise-ui:${IMAGE_TAG}
    container_name: fx-enterprise-ui
    restart: unless-stopped
    ports:
      - "${ENTERPRISE_UI_PORT:-17001}:80"
    networks:
      - fx

networks:
  fx:
    name: ${FX_DOCKER_NETWORK:-fx-delivery}
    driver: bridge
